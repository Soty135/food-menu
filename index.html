<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0c">
<meta name="description" content="Davels Kitchen food menu. Scroll to browse, tap any page to zoom.">
<meta property="og:title" content="Davels Kitchen - Food Menu">
<meta property="og:description" content="Browse the Davels Kitchen menu. Tap any page to zoom in.">
<meta property="og:type" content="website">
<title>Davels Kitchen - Food Menu</title>
<link rel="stylesheet" href="assets/styles.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230b0b0c'/%3E%3Ctext x='16' y='23' font-family='Georgia,serif' font-size='19' fill='%23fff' text-anchor='middle'%3ED%3C/text%3E%3C/svg%3E">
</head>
<body>

<a class="skip-link" href="#deck">Skip to menu</a>

<main id="deck" class="deck" aria-label="Menu pages"></main>

<div id="deck-end" class="deck-end" hidden>
  <p class="deck-end__note">That&rsquo;s the whole menu.</p>
  <button type="button" class="deck-end__top" id="back-to-top">
    <svg class="deck-end__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <path d="M12 19V5M5 12l7-7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <span>Back to top</span>
  </button>
</div>

<p id="page-counter" class="page-counter" hidden aria-hidden="true"></p>

<p id="status" class="status" role="status" aria-live="polite">Loading menu&hellip;</p>

<a class="call-fab" href="tel:+2817605675">
  <svg class="call-fab__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
    <path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.24 11.4 11.4 0 0 0 3.6.58 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1 11.4 11.4 0 0 0 .58 3.6 1 1 0 0 1-.25 1z"/>
  </svg>
  <span>Call to order</span>
</a>

<div id="lightbox" class="lightbox" hidden>
  <button type="button" class="lightbox__close" aria-label="Close zoomed page">
    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </svg>
  </button>
  <div class="lightbox__stage" id="lightbox-stage">
    <img id="lightbox-img" alt="">
  </div>
  <p class="lightbox__hint" id="lightbox-hint">Pinch or double-tap to zoom &middot; swipe to pan</p>
</div>

<noscript>
  <p class="status status--error">This menu needs JavaScript to scroll. Please enable it, or call +281-760-5675 to order.</p>
</noscript>

<script src="assets/app.js" defer></script>
</body>
</html>
